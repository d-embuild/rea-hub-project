worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
  limit_req_zone $binary_remote_addr zone=scan:10m  rate=5r/s;
  limit_req_zone $binary_remote_addr zone=authz:10m rate=2r/s;
  client_max_body_size 64k;

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /v1/redemptions { limit_req zone=scan burst=10 nodelay;  include /etc/nginx/proxy.inc; proxy_pass http://api:8080; }
    location /v1/tags        { limit_req zone=authz burst=5 nodelay;  include /etc/nginx/proxy.inc; proxy_pass http://api:8080; }
    location /v1/auth        { limit_req zone=authz burst=5 nodelay;  include /etc/nginx/proxy.inc; proxy_pass http://api:8080; }
    location /               { limit_req zone=api burst=40 nodelay;   include /etc/nginx/proxy.inc; proxy_pass http://api:8080; }
  }
}
